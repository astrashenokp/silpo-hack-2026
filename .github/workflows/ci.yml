name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (documented command)
        run: python -m pip install -e 'services/api[test]'
      - name: Backend tests
        run: python -m pytest services/api/tests -q -p no:cacheprovider
      - name: Generated contracts and fixtures are current
        run: python services/api/scripts/export_contracts.py --check

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end through Next.js forwarding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend and e2e dependencies
        run: |
          python -m pip install -e 'services/api[test]'
          python -m pip install -r tests/e2e/requirements.txt
      - name: Build frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Start both services
        run: |
          nohup python -m uvicorn smart_basket.app:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          (cd apps/web && nohup npm run start -- --port 3000 > ../../web.log 2>&1 &)
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          echo "Stack did not become healthy"
          exit 1
      - name: Run e2e suite
        env:
          E2E_BASE_URL: http://localhost:3000
        run: python -m pytest tests/e2e
      - name: Service logs
        if: always()
        run: cat api.log web.log 2>/dev/null || true

  docker:
    name: Deployment images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web image
        run: docker build -f deploy/web.Dockerfile --build-arg API_BASE_URL=http://api:8000 -t smart-basket-web .
      - name: API image
        run: docker build -f deploy/api.Dockerfile -t smart-basket-api .

  ui:
    name: UI flows and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tests/ui/package-lock.json
      - name: Install and start the API
        run: |
          python -m pip install -e 'services/api[test]'
          nohup python -m uvicorn smart_basket.app:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
      - name: Build and start the web app
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          nohup npm run start -- --port 3000 > ../../web.log 2>&1 &
      - name: Install Playwright and Chromium
        working-directory: tests/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for the web app and the API behind it
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/api/health && exit 0
            sleep 1
          done
          cat api.log web.log
          exit 1
      - name: Playwright specs on desktop and mobile
        working-directory: tests/ui
        run: npm test
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/ui/reports/playwright
          retention-days: 7
