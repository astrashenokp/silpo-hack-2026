[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-basket-api"
version = "0.1.0"
description = "Smart Basket HTTP API and isolated integration mocks"
requires-python = ">=3.12"

<dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.11,<3",
    "mcp>=2.2,<3",
    "httpx2>=2.12,<3",
    "google-genai",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
